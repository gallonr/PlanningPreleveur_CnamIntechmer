<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning DSP — CNAM Intechmer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">

    <div class="login-logo">
      <svg width="180" height="50" viewBox="0 0 180 50" xmlns="http://www.w3.org/2000/svg">
        <rect width="180" height="50" rx="6" fill="#003189"/>
        <text x="12" y="28" font-family="Arial" font-weight="700" font-size="14" fill="#ffffff">CNAM</text>
        <text x="12" y="42" font-family="Arial" font-size="11" fill="#90b8e8">Intechmer</text>
        <line x1="68" y1="8" x2="68" y2="42" stroke="#4fa3d8" stroke-width="1"/>
        <text x="78" y="22" font-family="Arial" font-size="11" fill="#c8e0f8">Préleveur en</text>
        <text x="78" y="36" font-family="Arial" font-size="11" fill="#c8e0f8">Milieu Naturel</text>
      </svg>
    </div>

    <h1 class="login-title">Planning des enseignements</h1>
    <p class="login-subtitle">DSP Préleveur en Milieu Naturel — 2026-2027</p>

    <div id="loginForm">
      <div class="mb-3">
        <label for="emailInput" class="form-label fw-semibold">Votre adresse email</label>
        <input type="email" id="emailInput" class="form-control" placeholder="prenom.nom@exemple.fr" required autofocus>
      </div>
      <button id="btnLogin" class="btn-login btn">
        <i class="bi bi-envelope me-2"></i>Recevoir mon lien de connexion
      </button>
    </div>

    <div id="successMsg" class="alert alert-success mt-3 d-none" role="alert">
      <i class="bi bi-check-circle me-2"></i>
      <strong>Email envoyé !</strong><br>
      Vérifiez votre boîte mail et cliquez sur le lien pour accéder au planning.
    </div>

    <div id="errorMsg" class="alert alert-danger mt-3 d-none" role="alert">
      <i class="bi bi-exclamation-triangle me-2"></i>
      <span id="errorText"></span>
    </div>

    <div class="login-footer">
      <i class="bi bi-shield-lock me-1"></i>Connexion sécurisée par lien unique.<br>
      Problème d'accès ? Contactez <a href="mailto:regis.gallon@lecnam.net">regis.gallon@lecnam.net</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  // Si l'utilisateur est déjà connecté, rediriger
  (async () => {
    const s = await getSession();
    if (s) window.location.href = 'app.html';
  })();

  document.getElementById('btnLogin').addEventListener('click', async () => {
    const email = document.getElementById('emailInput').value.trim().toLowerCase();
    if (!email || !email.includes('@')) {
      document.getElementById('errorText').textContent = 'Veuillez saisir une adresse email valide.';
      document.getElementById('errorMsg').classList.remove('d-none');
      return;
    }
    document.getElementById('errorMsg').classList.add('d-none');
    document.getElementById('btnLogin').disabled = true;
    document.getElementById('btnLogin').innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Envoi en cours…';

    const error = await signInWithMagicLink(email);
    document.getElementById('btnLogin').disabled = false;
    document.getElementById('btnLogin').innerHTML = '<i class="bi bi-envelope me-2"></i>Recevoir mon lien de connexion';

    if (error) {
      document.getElementById('errorText').textContent = error.message;
      document.getElementById('errorMsg').classList.remove('d-none');
    } else {
      document.getElementById('loginForm').classList.add('d-none');
      document.getElementById('successMsg').classList.remove('d-none');
    }
  });

  document.getElementById('emailInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btnLogin').click();
  });
</script>
</body>
</html>
